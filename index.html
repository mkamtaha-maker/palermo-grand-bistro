<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu</title>
  <style>
    :root {
      --bg: #0c0c0c;
      --text: #e0e0e0;
      --card: #161616;
      --accent: #d4af37;
      --sub: #888888;
      --border: #222222;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      display: flex;
      justify-content: center;
    }

    .mobile-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg);
      padding: 20px 16px;
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .biz-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .biz-desc {
      font-size: 14px;
      color: var(--sub);
      margin-bottom: 12px;
    }

    .biz-phone {
      display: inline-block;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 20px;
    }

    .lang-toggle {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .toggle-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--sub);
      padding: 8px 20px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 600;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .toggle-btn:first-child {
      border-radius: 20px 0 0 20px;
    }

    .toggle-btn:last-child {
      border-radius: 0 20px 20px 0;
    }

    .cat-nav {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
      scrollbar-width: none;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .cat-nav::-webkit-scrollbar {
      display: none;
    }

    .cat-pill {
      white-space: nowrap;
      padding: 8px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .category-title {
      font-size: 20px;
      color: var(--accent);
      margin: 32px 0 16px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      text-transform: capitalize;
    }

    .item-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      transition: transform 0.2s;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .item-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    .item-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
      margin-left: 10px;
    }

    .item-desc {
      font-size: 13px;
      color: var(--sub);
      line-height: 1.4;
    }

    .badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--accent);
      color: #000;
      margin-inline-start: 8px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .menu-search {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      outline: none;
      margin-bottom: 16px;
    }

    .menu-footer {
      margin-top: 40px;
      padding: 20px 0;
      border-top: 1px dashed var(--border);
      font-size: 12px;
      color: var(--sub);
      text-align: center;
      line-height: 1.6;
    }

    [lang="ar"] {
      text-align: right;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="mobile-container">
  <header>
    <div class="biz-name">[Business Name]</div>
    <div class="biz-desc">[Description]</div>
    <a href="tel:[Phone]" class="biz-phone">📞 [Phone]</a>
  </header>

  <div class="lang-toggle">
    <button id="btn-en" class="toggle-btn active" onclick="switchLang('en')">English</button>
    <button id="btn-ar" class="toggle-btn" onclick="switchLang('ar')">العربية</button>
  </div>

  <div style="margin-bottom: 14px;">
    <input type="text" class="menu-search" placeholder="🔍 Search menu / ابحث في القائمة..." onkeyup="filterMenu(this)" />
  </div>

  <!-- ENGLISH SECTION -->
  <div id="section-en" lang="en" dir="ltr">
    <div class="cat-nav">
      <a href="#en-cat-1" class="cat-pill">[Category Name]</a>
    </div>

    <div id="en-cat-1">
      <h2 class="category-title">[Category Name]</h2>
      <div class="item-box">
        <div class="item-header">
          <div class="item-name">
            [Item Name]
            <span class="badge">Popular</span>
          </div>
          <div class="item-price">[Currency] [Price]</div>
        </div>
        <div class="item-desc">[Item Description]</div>
      </div>
    </div>
  </div>

  <!-- ARABIC SECTION -->
  <div id="section-ar" class="hidden" lang="ar" dir="rtl">
    <div class="cat-nav">
      <a href="#ar-cat-1" class="cat-pill">[اسم الفئة]</a>
    </div>

    <div id="ar-cat-1">
      <h2 class="category-title">[اسم الفئة]</h2>
      <div class="item-box">
        <div class="item-header">
          <div class="item-name">
            [اسم المنتج]
            <span class="badge">جديد</span>
          </div>
          <div class="item-price">[السعر] [Currency]</div>
        </div>
        <div class="item-desc">[وصف المنتج]</div>
      </div>
    </div>
  </div>

</div>

<script>
  function switchLang(lang) {
    const enSec = document.getElementById('section-en');
    const arSec = document.getElementById('section-ar');
    const btnEn = document.getElementById('btn-en');
    const btnAr = document.getElementById('btn-ar');

    if (lang === 'en') {
      enSec.classList.remove('hidden');
      arSec.classList.add('hidden');
      btnEn.classList.add('active');
      btnAr.classList.remove('active');
      document.documentElement.lang = "en";
    } else {
      enSec.classList.add('hidden');
      arSec.classList.remove('hidden');
      btnEn.classList.remove('active');
      btnAr.classList.add('active');
      document.documentElement.lang = "ar";
    }
  }

  function filterMenu(input) {
    const filter = input.value.toLowerCase();
    const activeSection = document.querySelector('.mobile-container > div:not(.hidden)[lang]');
    const items = activeSection.querySelectorAll('.item-box');
    
    items.forEach(item => {
      const text = item.textContent.toLowerCase();
      if (text.includes(filter)) {
        item.style.display = "";
      } else {
        item.style.display = "none";
      }
    });

    // Hide empty categories
    const categories = activeSection.querySelectorAll('div[id^="en-cat"], div[id^="ar-cat"]');
    categories.forEach(cat => {
      const visibleItems = cat.querySelectorAll('.item-box[style="display: px"], .item-box:not([style*="display: none"])');
      cat.style.display = visibleItems.
